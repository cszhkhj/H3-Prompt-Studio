<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 提示词工作台</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --line:#e3e2dd; --line2:#d0cfc8;
  --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#8b8a84;
  --acc:#0f6e56; --acc-bg:#e1f5ee; --acc-line:#1d9e75;
  --warn:#854f0b; --warn-bg:#faeeda; --warn-line:#ba7517;
  --err:#a32d2d; --err-bg:#fcebeb; --err-line:#e24b4a;
  --info:#185fa5; --info-bg:#e6f1fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:15px;font-weight:500;margin:0}
.sub{font-size:12px;color:var(--tx3)}
.spacer{flex:1}
button{font:13px inherit;padding:6px 12px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--acc-line);color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.primary:hover{background:#0c5c48;color:#fff}
button.sm{padding:3px 8px;font-size:12px}
select,input,textarea{font:13px inherit;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--tx);width:100%}
textarea{resize:vertical;line-height:1.55;font-family:ui-monospace,Consolas,monospace;font-size:12px}
label{display:block;font-size:12px;color:var(--tx2);margin:0 0 3px}
.wrap{padding:14px 18px;max-width:1180px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card>h2{font-size:13px;font-weight:500;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card>h2 .tag{font-size:11px;font-weight:400;color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.row{display:grid;gap:8px;margin-bottom:9px}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:1fr 1fr 1fr}
.r4{grid-template-columns:1fr 1fr 1fr 1fr}
.hint{font-size:11px;color:var(--tx3);margin-top:2px}
.route{background:var(--acc-bg);border:1px solid var(--acc-line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.route .big{font-size:14px;font-weight:500;color:#0f6e56}
.route .why{font-size:12px;color:#0f6e56;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 11px;border:1px solid var(--line2);border-radius:20px;cursor:pointer;font-size:12px;background:var(--panel)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fcfcfb}
.item .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item .hd b{font-size:12px;font-weight:500}
.msg{border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:12px;border:1px solid}
.msg.e{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
.msg.w{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.msg.i{background:var(--info-bg);border-color:#85b7eb;color:var(--info)}
.msg b{font-weight:500}
.out{background:#fcfcfb;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto;line-height:1.6}
.tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.tab{padding:6px 12px;cursor:pointer;font-size:12px;border-bottom:2px solid transparent;color:var(--tx2)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--acc-line)}
.tabs.inline{display:inline-flex;margin:0 0 0 10px;border-bottom:none;vertical-align:middle}
.ck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);margin-bottom:5px}
.ck input{width:auto}
.sec{display:none}.sec.on{display:block}
.mini{font-size:11px;color:var(--tx3)}
kbd{font:11px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:1px 4px}
.subtag{font-size:11px;font-weight:500;color:var(--acc);margin:12px 0 6px;display:flex;align-items:center;gap:7px}
.subtag:before{content:"";width:3px;height:12px;border-radius:2px;background:var(--acc-line)}
.subtag .n{font-weight:400;color:var(--tx3)}
.pill{padding:4px 10px;border:1px solid var(--line2);border-radius:20px;cursor:pointer;font-size:12px;background:var(--panel);white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill:hover{border-color:var(--acc-line)}
table.pl{width:100%;border-collapse:collapse}
table.pl th{font-size:11px;font-weight:500;color:var(--tx3);text-align:left;padding:4px 5px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.pl td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pl td.idx{font:11px ui-monospace,Consolas,monospace;color:var(--tx3);white-space:nowrap;padding-right:6px}
table.pl select,table.pl input{font-size:12px;padding:4px 5px}
table.pl textarea{font-size:12px;padding:4px 6px;min-height:34px}
.dlg{display:grid;gap:6px;grid-template-columns:2fr 1.1fr 76px 26px;align-items:center;margin-bottom:5px}
.dlg input{width:100%}
.h3tip{background:var(--info-bg);border:1px solid #85b7eb;border-radius:6px;padding:6px 9px;font-size:11px;color:var(--info);line-height:1.7;margin-bottom:9px}
.badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);margin-left:5px;font-weight:400}
.badge.ok{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc)}
.steps{background:var(--acc-bg);border:1px solid var(--acc-line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#0f6e56;line-height:1.75}
.steps b{font-weight:500}
.steps .flow{font-weight:500}
.steps .flow i{font-style:normal;color:var(--tx3);font-weight:400}
.subtag .stp{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:500;padding:0 4px}
tr.na td{opacity:.4}
td.segcell{white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>H3 提示词工作台</h1>
  <span class="sub">MiniMax H3 · 本地开源权重 · 离线可用</span>
  <div class="spacer"></div>
  <button onclick="saveProj()">保存项目</button>
  <button onclick="loadProj()">读取项目</button>
  <button onclick="saveLocal()" title="把全部内容（含已生成的提示词段落）保存为你自选路径的本地文件">保存到本地</button>
  <button onclick="loadLocal()" title="从本地文件读取之前保存的全部内容">读取本地</button>
  <button onclick="expJSON()">导出 JSON</button>
  <button onclick="impJSON()">导入</button>
  <button onclick="resetAll()">清空</button>
</header>

<div class="wrap">
<div>

  <div class="card">
    <h2>1 · 模式路由 <span class="tag">先定权重，再写词</span></h2>
    <div class="route">
      <div class="big" id="routeOut">模型权重：FL2VA ｜ 任务模式：T2VA</div>
      <div class="why" id="routeWhy">纯文字输入，无参考素材。</div>
    </div>
    <label>你的素材构成（决定权重与任务模式）</label>
    <div class="chips" id="matChips">
      <div class="chip on" data-m="none">纯文字</div>
      <div class="chip" data-m="first">一张首帧图</div>
      <div class="chip" data-m="last">一张尾帧图</div>
      <div class="chip" data-m="both">首尾两张帧</div>
      <div class="chip" data-m="refimg">参考图（人物/风格/场景）</div>
      <div class="chip" data-m="refvid">参考视频 / 待编辑源</div>
      <div class="chip" data-m="refaud">参考音频</div>
    </div>
    <div class="row r2">
      <div><label>生成时长（秒）</label><select id="duration"></select></div>
      <div><label>画幅</label><select id="aspect" onchange="S.aspect=this.value">
        <option value="16:9">16:9 横屏</option><option value="9:16">9:16 竖屏</option><option value="1:1">1:1 方形</option>
        <option value="4:3">4:3 横屏</option><option value="3:4">3:4 竖屏</option><option value="21:9">21:9 超宽银幕</option>
      </select></div>
    </div>
    <div class="row r2">
      <div><label>权重预设（你的 checkpoint）</label><select id="ckpt" onchange="S.ckpt=this.value">
        <option value="fl2va" title="minimax_h3_fl2va_pruned_int8_convrot">FL2VA 剪枝权重（首尾帧 / 通用）</option>
        <option value="ref" title="minimax_h3_fused_refdelta_r1024_turbo8_mystic07_int8_convrot">Ref2VA turbo8 参考权重（8 步加速）</option>
        <option value="other">其他 / 自定义权重</option>
      </select></div>
      <div><label>本地服务地址（自动填好，可改）</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="apiUrl" value="http://127.0.0.1:8080/v1" oninput="S.apiUrl=this.value" style="flex:1">
          <span class="mini" style="white-space:nowrap">模型 <b>QweN3.6_35B</b></span>
        </div>
        <input id="modelId" type="hidden">
        <div style="margin-top:6px"><button class="sm" onclick="testConn()">测试连接</button>
        <span class="mini" id="connInfo"></span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2 · 提示词生成
      <span class="tabs inline">
        <span class="tab on" data-w="brief" onclick="wTab('brief')">一句话生成</span>
        <span class="tab" data-w="multi" onclick="wTab('multi')">多段提示词</span>
      </span>
    </h2>


    <div id="paneBrief" style="display:none">
      <label>用大白话写需求，笼统或详细都行</label>
      <textarea id="briefText" rows="6" oninput="S.brief=this.value" placeholder="详细：雨夜公交站，一个穿深色大衣的女人收起黑伞，抬头看向驶来的公交车，镜头缓缓推近，5 秒，环境声是雨声和引擎声。&#10;笼统：赛博朋克街头，孤独感，一个人走在霓虹里"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
        <button class="primary" onclick="genFromBrief()" id="genBtn">生成完整提示词</button>
        <span class="mini" id="genInfo"></span>
      </div>
      <div id="briefOutWrap" style="display:none;margin-top:10px">
        <label>生成结果（可直接复制）</label>
        <textarea id="briefOut" rows="12" readonly style="font:12px ui-monospace,Consolas,monospace"></textarea>
        <div style="margin-top:6px"><button class="sm" onclick="copyBrief()">复制</button></div>
      </div>
    </div>

    <div id="paneMulti" style="display:none">

      <div class="subtag"><span class="stp">1</span> 要拍什么</div>
      <label>整体需求（一句话，笼统或详细都行）</label>
      <textarea id="multiBrief" rows="3" oninput="S.multiBrief=this.value;calcSplit()"
        placeholder="女孩在落地窗前跳现代舞，情绪由内敛逐渐释放，自然光"></textarea>
      <div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap">
        <button class="sm" onclick="pickBriefImg()">上传图片识别</button>
        <span class="mini" id="imgInfo"></span>
      </div>
      <div id="imgPrevWrap" style="display:none;margin-top:6px;align-items:center;gap:8px">
        <img id="imgPrev" style="max-height:110px;border-radius:6px;border:1px solid var(--line2)" alt="识别中预览">
      </div>

      <div class="row r2" style="margin-top:10px">
        <div><label>每段时长（秒，上限 15）</label>
          <select id="multiSeg" onchange="calcSplit()">
            <option value="8">8 秒</option>
            <option value="10" selected>10 秒（推荐）</option>
            <option value="12">12 秒</option>
            <option value="15">15 秒（上限）</option>
            <option value="6">6 秒</option>
          </select></div>
        <div><label>累计进度</label><div id="multiPlan" class="mini" style="padding-top:6px">—</div></div>
      </div>

      <div class="row r2" style="margin-top:10px">
        <div><label>参考图张数（自动统计，不用填）</label>
          <div id="multiPicCount" class="mini" style="padding-top:6px">—</div></div>
      </div>
      <label style="margin-top:10px">每张参考图是什么（一行写一张，可空；留空则由模型按需求推断）</label>
      <textarea id="multiPicNote" rows="2" oninput="S.multiPicNote=this.value;renderMultiList()"
        placeholder="第 1 张：人物全身正面照，冷白皮、黑长直发&#10;第 2 张：国风室内场景，落地窗与自然光"></textarea>

      <div class="subtag"><span class="stp">2</span> 锁住身份与全片状态</div>
      <div class="row r2" style="margin-top:10px">
        <div><label>主体锚定句式（&lt;Subject 1&gt; 定义行 + retention_analysis 双锚定）</label>
          <select id="multiWear" onchange="pickWear()">
            <option value="none">不使用</option>
            <option value="cloth">服装标签</option>
            <option value="suit">紧身衣标签</option>
          </select></div>
        <div><label>把当前句式存为预设</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:4px">
            <button class="sm" onclick="saveWear('cloth')">存为「服装」</button>
            <button class="sm" onclick="saveWear('suit')">存为「紧身衣」</button>
            <button class="sm" onclick="clearWear()">清空</button>
          </div></div>
      </div>
      <textarea id="multiWearText" rows="3" oninput="S.multiWearText=this.value"
        placeholder="留空则模型自由写；填入后，每一段 subject_definitions 的 <Subject 1> 与 retention_analysis 的 <Subject 1> 行都会同时钉住这句"></textarea>

      <div class="row r2" style="margin-top:12px">
        <div><label>状态锚定卡 · 人物（&lt;Subject 1&gt; 状态，上限 250 字）</label>
          <textarea id="anchChar" rows="4" maxlength="250" oninput="anchIn('char',this)"
            placeholder="女巨人立于都市中心，紧身战衣，冷白皮肤；胸杯裁片切除消失露出胸部，裆插片消失露出阴户；其余（四肢、背部、手腕脚踝、腰胯侧）完整覆盖"></textarea>
          <div class="mini" id="cntChar">0 / 250</div></div>
        <div><label>状态锚定卡 · 场景（&lt;Subject 2&gt; 环境与光线，上限 500 字）</label>
          <textarea id="anchScene" rows="4" maxlength="500" oninput="anchIn('scene',this)"
            placeholder="高楼林立的现代都市，乌云黄昏；云层漫过巨人肩胸，摩天大楼仅及腰部；电影级打光，细腻柔和，冷调"></textarea>
          <div class="mini" id="cntScene">0 / 500</div></div>
      </div>
      <label style="margin-top:8px">持续状态（&lt;Subject 3&gt; · 贯穿全片的动作或状态序列，可空，上限 250 字）</label>
      <textarea id="anchState" rows="2" maxlength="250" oninput="anchIn('state',this)"
        placeholder="贯穿全片的持续高潮序列，伴随全身震颤、痉挛、发声与液体喷发，节奏收紧与放松交替"></textarea>
      <div class="mini" id="cntState">0 / 250</div>
      <div class="row r3" style="margin-top:8px">
        <div><label>运镜方式</label><select id="anchCam" onchange="S.anchorCam=this.value">
          <option value="">（不指定）</option>
          <option value="推近">推近 · Push In</option><option value="拉远">拉远 · Pull Out</option>
          <option value="变焦推近">变焦推近 · Zoom In</option><option value="变焦拉远">变焦拉远 · Zoom Out</option>
          <option value="左摇">左摇 · Pan Left</option><option value="右摇">右摇 · Pan Right</option>
          <option value="左横移">左横移 · Truck Left</option><option value="右横移">右横移 · Truck Right</option>
          <option value="上摇">上摇 · Tilt Up</option><option value="下摇">下摇 · Tilt Down</option>
          <option value="升镜">升镜 · Pedestal Up</option><option value="降镜">降镜 · Pedestal Down</option>
          <option value="弧形环绕">弧形环绕 · Arc Shot</option><option value="跟踪跟拍">跟踪跟拍 · Tracking Shot</option>
          <option value="轻微抖动">轻微抖动 · Shake Slightly</option><option value="主观视角">主观视角 · POV</option>
          <option value="顺时针滚转">顺时针滚转 · Roll CW</option><option value="逆时针滚转">逆时针滚转 · Roll CCW</option>
        </select></div>
        <div><label>拍摄距离</label><select id="anchDist" onchange="S.anchorDist=this.value">
          <option value="">（不指定）</option>
          <option value="极端远景">极端远景</option><option value="远景">远景</option>
          <option value="全景">全景</option><option value="中全景">中全景</option>
          <option value="中景">中景</option><option value="近景">近景</option>
          <option value="特写">特写</option><option value="大特写">大特写</option>
          <option value="极端特写">极端特写</option>
        </select></div>
        <div><label>镜头是否固定</label><select id="anchFix" onchange="S.anchorFix=this.value">
          <option value="">（不指定）</option>
          <option value="固定机位">固定机位，全段不变</option>
          <option value="段内可变化">段内可变化</option>
        </select></div>
      </div>

      <div class="subtag"><span class="stp">3</span> 排本段镜头</div>
      <div class="row r3">
        <div><label>本段镜头数</label><select id="shotCount" onchange="setShotCount(this.value)"></select></div>
        <div><label>分镜策略</label><select id="shotMode" onchange="S.shotMode=this.value;applyShotMode()">
          <option value="even">平均切分（每镜等长，推荐）</option>
          <option value="manual">手动指定时间点</option>
          <option value="fixed">固定机位单镜到底（只 1 镜）</option>
          <option value="free">自由（只给约束，模型自行编排）</option>
        </select></div>
        <div><label>全段运镜基调（可空）</label><select id="shotCamBase" onchange="S.shotCamBase=this.value">
          <option value="">（不指定）</option>
          <option value="以推近为主">以推近为主 · 情绪收紧</option>
          <option value="以拉远为主">以拉远为主 · 情绪释放</option>
          <option value="以左右横移为主">以左右横移为主 · 平稳铺陈</option>
          <option value="以手持晃动为主">以手持晃动为主 · 纪实紧张</option>
          <option value="以弧形环绕为主">以弧形环绕为主 · 立体展示</option>
          <option value="以固定机位为主">以固定机位为主 · 冷静克制</option>
        </select></div>
      </div>
      <div class="row r2">
        <div><label>镜头间转场</label><select id="shotTrans" onchange="S.shotTrans=this.value">
          <option value="">（不指定）</option>
          <option value="硬切">硬切 · Hard Cut</option>
          <option value="叠化">叠化 · Cross Dissolve</option>
          <option value="渐隐渐显">渐隐渐显 · Fade</option>
          <option value="匹配剪辑">匹配剪辑 · Match Cut</option>
          <option value="无明显剪辑">无明显剪辑（长镜头内做景别变化）</option>
        </select></div>
        <div><label>末镜收尾要求</label><select id="shotEnd" onchange="S.shotEnd=this.value">
          <option value="">（默认）以定格状态收尾，供下一段接戏</option>
          <option value="必须正对镜头">末镜正对镜头（便于下一段正面起手）</option>
          <option value="必须留出肩后空间">末镜留出肩后空间（与下一段主体呼应）</option>

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function $(id){return document.getElementById(id);}
function syncChips(){
  var all=document.querySelectorAll("#matChips .chip");
  for(var i=0;i<all.length;i++)all[i].classList.toggle("on",all[i].dataset.m===S.mat);
}
function pickMat(m){
  S.mat=m;syncChips();route();
}
function wTab(k){
  S.work=k;
  var map={brief:"paneBrief",multi:"paneMulti"};
  for(var key in map){var e=$(map[key]);if(e)e.style.display=(key===k?"":"none");}
  var ts=document.querySelectorAll("[data-w]");
  for(var i=0;i<ts.length;i++)ts[i].classList.toggle("on",ts[i].getAttribute("data-w")===k);
  var w=$("multiWarn");
  if(k==="multi"){
    if(S.mat!=="refimg"&&S.mat!=="refvid"&&S.mat!=="refaud"){S.matPrev=S.mat;pickMat("refimg");}
    if(w)w.innerHTML="已自动切到 <b>Ref2VA 参考模式</b>（权重预设同步为 Ref2VA turbo8）。多段长视频必须有参考素材锚定身份，否则跨段会换人 —— 请在 ① 的「每张参考图是什么」里一行写清每张图的内容（也可用「上传图片识别」让视觉模型代写）。";
  }else{
    if(S.matPrev){pickMat(S.matPrev);S.matPrev="";}
    if(w)w.innerHTML="";
  }
  if(k==="multi")renderMultiList();
}

function init(){
  var d=$("duration");
  for(var i=4;i<=15;i++){var o=document.createElement("option");o.value=i;o.text=i+" 秒";d.appendChild(o);}
  d.value=S.duration||5;
  d.onchange=function(){S.duration=+d.value;};
  $("aspect").value=S.aspect||"16:9";
  $("ckpt").value=S.ckpt||"fl2va";
  $("apiUrl").value=S.apiUrl||"http://127.0.0.1:8080/v1";
  $("briefText").value=S.brief||"";
  $("briefOut").value=S.briefOut||"";
  $("briefOutWrap").style.display=S.briefOut?"":"none";
  var cs=document.querySelectorAll("#matChips .chip");
  for(var j=0;j<cs.length;j++){cs[j].onclick=function(){pickMat(this.dataset.m);};}
  $("multiBrief").value=S.multiBrief||"";$("multiSeg").value=S.multiSeg||"10";
  $("multiPicNote").value=S.multiPicNote||"";

  $("multiWear").value=S.multiWear||"none";$("multiWearText").value=S.multiWearText||"";
  loadAnchor();
  initShotCount();
  loadDialogue();
  if(!S.shotPlan)S.shotPlan=[];
  if(S.shotAlign===undefined)S.shotAlign=true;

  syncChips();route();calcSplit();renderMultiList();renderShotPlan();renderLines();
  wTab(S.work==="multi"?"multi":"brief");
}

function route(){
  var m=S.mat,w,t,why;
  if(m==="none"){w="FL2VA";t="T2VA";why="纯文字输入，从文本直接构建完整时间线。";}
  else if(m==="first"){w="FL2VA";t="I2VA";why="图片被指定为视频第 0 秒首帧，需要从该帧向后连续生成。";}
  else if(m==="last"){w="FL2VA";t="L2VA";why="图片只锚定视频最后一帧，需推断前置状态并收敛到该帧。";}
  else if(m==="both"){w="FL2VA";t="FL2VA";why="两张图片分别锚定首帧与尾帧，描述两者之间的连续路径。";}
  else {w="Ref2VA";t="Ref2VA";why="素材承担参考职责（人物/风格/场景/动作/音色），不是具体起止帧。";}
  S.weight=w;S.task=t;
  $("routeOut").textContent="模型权重："+w+" ｜ 任务模式："+t;
  $("routeWhy").textContent=why;
  var sel=$("ckpt");
  if(w==="Ref2VA"&&S.ckpt==="fl2va"){sel.value="ref";S.ckpt="ref";}
  else if(w!=="Ref2VA"&&S.ckpt==="ref"){sel.value="fl2va";S.ckpt="fl2va";}
}

function opts(pairs,cur){var h="";for(var i=0;i<pairs.length;i++){var v=pairs[i][0],t=pairs[i][1];h+='<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(t)+'</option>';}return h;}

var CLEAN_SCRIPT="D:\\Ai\\WB\\free-vram.bat";
function copyScriptPath(){cp(CLEAN_SCRIPT);$("resInfo").textContent="已复制："+CLEAN_SCRIPT+" （粘贴到资源管理器地址栏回车即可运行）";}
function llamaBase(){var u=($("apiUrl").value||"").trim();if(!u)return "";u=u.replace(/\/+$/,"");return u.replace(/\/v1$/,"");}
function refreshRes(){
  var b=llamaBase(),info=$("resInfo");
  if(!b){info.innerHTML='<span style="color:var(--warn)">未填 llama 服务地址，查不到状态。</span>';return;}
  info.textContent="查询中…";
  fetch(b+"/v1/models").then(function(r){return r.text();}).then(function(t){
    var j={};try{j=JSON.parse(t);}catch(e){throw new Error(t.slice(0,80));}
    var st="?";(j.data||[]).forEach(function(m){if(m.id===DEF_MODEL&&m.status)st=m.status.value;});
    if(st==="loaded")info.innerHTML='llama 模型 <b style="color:var(--err)">已加载</b> —— 占用约 21.4 GB 显存 + 20.4 GB 内存，点上方按钮可释放。';
    else if(st==="unloaded")info.innerHTML='llama 模型 <b style="color:var(--acc)">未加载</b> —— 仅占 200 MB，无需清理。';
    else info.textContent="llama 模型状态："+st;
  }).catch(function(e){info.innerHTML='<span style="color:var(--warn)">查不到 llama 服务（未启动或地址不对）</span>';});
}
function unloadModel(){
  var b=llamaBase();
  if(!b){alert("先在上方「本地服务地址」填写 llama 服务地址，例如 http://127.0.0.1:8080/v1");return;}
  $("resInfo").textContent="正在卸载…";
  fetch(b+"/models/unload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:DEF_MODEL})})
  .then(function(r){return r.text().then(function(t){return{s:r.status,t:t};});})
  .then(function(o){
    var ok=false;try{ok=JSON.parse(o.t).success;}catch(e){}
    if(ok){
      $("resInfo").innerHTML='已卸载 —— <b>约 21 GB 显存已回收</b>，llama 服务仍在运行，下次用 AI 会自动重载（约 30 秒）。';
      flash("显存已释放");
    }else if(o.t.indexOf("not running")>=0){
      $("resInfo").textContent="模型本来就没加载，无需释放。";
    }else{
      $("resInfo").textContent="返回 "+o.s+"："+o.t.slice(0,120);
    }
  }).catch(function(e){
    $("resInfo").innerHTML='<span style="color:var(--warn)">浏览器请求被拦截，请改用脚本：'+CLEAN_SCRIPT+'</span>';
  });
}
function lsKB(){var n=0;try{for(var i=0;i<localStorage.length;i++){n+=(localStorage.getItem(localStorage.key(i))||"").length;}}catch(e){}return Math.round(n*2/1024);}

/* ===== 保存到本地 / 读取本地（自选路径）===== */
function saveLocal(){
  var name="h3-prompt-"+(new Date()).toISOString().slice(0,10)+".json";
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({suggestedName:name,types:[{description:"H3 工作台存档（JSON）",accept:{"application/json":[".json"]}}]})
    .then(function(h){return h.createWritable();})
    .then(function(w){return w.write(snapshot()).then(function(){return w.close();});})
    .then(function(){
      flash("已保存到本地");
      var ri=$("resInfo");if(ri)ri.textContent="已把全部内容（含已生成的提示词段落）保存到你自选路径的本地文件，之后可用顶部「读取本地」原样读回。";
    })
    .catch(function(e){
      if(e&&e.name==="AbortError")return;   // 用户取消保存框，不算错误
      dl(name,snapshot());flash("浏览器限制自选路径，已改为下载存档");
    });
  }else{
    dl(name,snapshot());flash("该浏览器不支持自选路径，已下载存档文件");
  }
}
function loadLocal(){
  if(window.showOpenFilePicker){
    window.showOpenFilePicker({types:[{description:"H3 工作台存档（JSON）",accept:{"application/json":[".json"]}}]})
    .then(function(h){return h[0].getFile();})
    .then(function(f){return f.text().then(function(t){apply(t);});})
    .then(function(){flash("已从本地读取");})
    .catch(function(e){if(e&&e.name==="AbortError")return;flash("读取失败："+e.message);});
  }else{
    var i=document.createElement("input");i.type="file";i.accept=".json,.txt";
    i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){apply(r.result);flash("已读取");};r.readAsText(f);};
    i.click();
  }
}
function apply(d){
  var keepWear=S.wearPreset||{cloth:"",suit:""};

  $("multiPicNote").value=S.multiPicNote||"";
  $("multiWear").value=S.multiWear||"none";$("multiWearText").value=S.multiWearText||"";
  loadAnchor();
  initShotCount();loadDialogue();
  if(!S.shotPlan)S.shotPlan=[];
  if(S.shotAlign===undefined)S.shotAlign=true;

var IMG_BUSY=false;

function recognizeImg(f){
  var base=apiBase();
  if(!base){alert("先在上方「本地服务地址」填写 llama-server 地址");return;}
  if(f.type&&f.type.indexOf("image/")!==0){alert("请选择图片文件");return;}
  var info=$("imgInfo"),prevWrap=$("imgPrevWrap"),prev=$("imgPrev");
  IMG_BUSY=true;
  var objUrl=URL.createObjectURL(f),dataUrl="";
  prev.src=objUrl;prevWrap.style.display="";prevWrap.style.display="flex";
  info.textContent="图片读取中…";
  var r=new FileReader();
  r.onload=function(){
    dataUrl=String(r.result||"");
    if(!dataUrl){imgCleanup();info.textContent="图片读取失败，请换一张试试";return;}
    info.textContent="视觉模型识别中…（约 20-60 秒，识别完自动清理图片）";
    reqJSON(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:DEF_MODEL,messages:[{role:"user",content:[
        {type:"text",text:"请仔细观察这张图片，输出一段中文描述，供视频提示词创作使用。要求：写清主体（人物/物体）的外观特征（发型发色、服装款式与颜色、体型与姿态）、场景环境与光线、画面风格与构图；语言具体、可直接用于写视频提示词。只输出描述文字本身，不要任何解释、前言或代码块围栏。"},
        {type:"image_url",image_url:{url:dataUrl}}]}],
        temperature:0.4,max_tokens:4096,chat_template_kwargs:{enable_thinking:false}})})
    .then(function(j){
      var t=aiText(j).replace(/```[a-z]*/gi,"").replace(/```/g,"").trim();
      var e=$("multiBrief"),cur=(e.value||"").trim();
      e.value=(cur?cur+"\n":"")+t;
      S.multiBrief=e.value;
      info.textContent="已识别并把内容写进「整体需求」框，图片缓存已自动清理。";
      flash("图片已识别");
    })
    .catch(function(e){info.textContent="识别失败："+e.message;})
    .then(function(){imgCleanup();});
  };
  r.onerror=function(){imgCleanup();info.textContent="图片读取失败，请换一张试试";};
  r.readAsDataURL(f);
  function imgCleanup(){
    // 识别结束（无论成败）：立刻清理图片缓存 —— 释放预览、丢弃 base64、回收 objectURL
    dataUrl="";
    try{URL.revokeObjectURL(objUrl);}catch(_e){}
    prev.src="";
    prevWrap.style.display="none";
    IMG_BUSY=false;
  }
}

function cleanEnd(s){
  s=String(s==null?"":s);
  s=s.replace(/^\s*(?:本段|段落)结束(?:时(?:的新状态|的状态|的新姿态)?)?(?:为|是|：|:)?\s*/,"");
  s=s.replace(/^\s*(一句话|one\s+sentence|the\s+new\s+state|final\s+state|new\s+pose)\s*[:：\-–]?\s*/i,"");
  return s.trim();
}
function cleanTpl(x){
  x=String(x==null?"":x);
  x=x.replace(/^\s*(一句话|one sentence)\s*[:：]\s*/gm,"");
  x=x.replace(/^\s*<(?!Subject|Picture|Video|Audio|Segment|Shot)[^<>]*>\s*$/gm,"");
  x=x.replace(/^\s*<Subject\s*\d+>\s*(is|为)?\s*(\.\.\.|…|…+)\s*$/gmi,"");
  x=x.replace(/\n{3,}/g,"\n\n").trim();
  return x;
}
function lastShotOf(t){
  t=String(t==null?"":t);
  var re=/\[Shot\s*\d+\]/gi,m,last=-1;
  while((m=re.exec(t)))last=m.index;
  if(last<0)return "";
  var s=t.slice(last);
  var nx=/\n\s*\n/.exec(s);
  if(nx&&nx.index>40)s=s.slice(0,nx.index);
  return s.trim().slice(0,400);
}
function shotStart(t){
  t=String(t||"");
  var d=/\bdetailed_description\s*:/i.exec(t);
  var s=d?t.slice(d.index):t;
  var m=/\[Shot\s*(\d+)\]/i.exec(s);
  return m?+m[1]:0;
}
function normSeg(t,dur){
  var to="[Segment 1: 0.000 - "+(+dur||0).toFixed(3)+" seconds]";
  return String(t==null?"":t).replace(/\[Segment\s*\d+\s*:\s*[^\[\]]*?seconds?\]/gi,to);
}
function extractHead(t){
  t=String(t==null?"":t);
  var dm=/\n\s*detailed_description\s*:/i.exec(t);
  return dm?t.slice(0,dm.index).trim():"";
}
function soundOf(t){
  var m=/\n\s*overall_soundscape\s*:/i.exec(String(t||""));
  if(!m)return "";
  return String(t).slice(m.index).replace(/\s+/g," ").trim().slice(0,240);
}
function missingFields(t){
  var out=[],i;
  for(i=0;i<SIX.length;i++){
    var re=new RegExp("(^|\\n)\\s*"+SIX[i]+"\\s*:","i");
    if(!re.test(String(t||"")))out.push(SIX[i]);
  }
  return out;
}
function parseMultiSeg(t){
  var s=String(t==null?"":t).replace(/```[a-z]*\s*/gi,"").trim();
  var endM=/###END###\s*([\s\S]*?)(?=\n\s*###|$)/i.exec(s);
  var end=endM?cleanEnd(endM[1]):"";
  if(endM)s=s.replace(/###END###[\s\S]*?(?=\n\s*###|$)/i,"").trim();
  s=s.replace(/^\s*#{2,4}\s*(HEAD|BODY|TAIL|PROMPT|END)\s*#{0,4}\s*$/gmi,"");
  var m=/\bsubject_definitions\s*:/i.exec(s);
  if(m&&m.index>0)s=s.slice(m.index);
  s=cleanTpl(s);
  return {text:s,head:extractHead(s),end:end,lastShot:lastShotOf(s),
          miss:missingFields(s),has:/detailed_description\s*:/i.test(s)};
}
function aiText(j){

function autoPlaceLines(){
  var ls=S.lines||[];
  if(!ls.length){alert("先加几句台词");return;}
  var cur=curSegNo(),segIdx=cur-1;
  var todo=linesForSeg(segIdx),i;
  if(!todo.length){
    alert("待生成的第 "+cur+" 段还没有台词。\n\n可把某句的「在哪一段」改成「第 "+cur+" 段」或「不限」，再点这个按钮。");
    return;
  }
  if(S.shotAlign===false&&!confirm("「台词必须落在所指定的镜头内」当前没勾上，仍按镜头归属排时间点吗？"))return;
  applyShotMode("quiet");
  var plan=S.shotPlan||[],dur=segDur();
  function num2(v){var x=parseFloat(String(v==null?"":v).replace(/[^\d.]/g,""));return isNaN(x)?0:x;}
  function win(sn){
    if(!plan.length)return [0,dur];
    if(sn>=1&&sn<=plan.length){
      var st=num2(plan[sn-1].at);
      var nt=(sn<plan.length)?num2(plan[sn].at):dur;
      if(nt<=st)nt=Math.min(dur,st+1);
      return [st,nt];
    }
    return [0,dur];
  }
  // 第一遍：定归属（没指定镜头的，按顺序铺到各镜）
  var groups={},seq=0;
  for(i=0;i<todo.length;i++){
    var l=todo[i];
    var sn=parseInt(l.shot,10)||0;
    if(sn<1||sn>plan.length){sn=plan.length?((seq%plan.length)+1):0;}
    seq++;
    if(sn&&plan.length)l.shot=String(sn);
    var key=String(sn);
    if(!groups[key])groups[key]=[];
    groups[key].push(l);
  }
  // 第二遍：在同一镜的时间窗内均匀分布
  var key2;
  for(key2 in groups){
    var arr=groups[key2],w=win(parseInt(key2,10)||0);
    var st=w[0],nt=w[1],len=Math.max(0.4,nt-st);
    for(var q=0;q<arr.length;q++){
      var vo=(String(arr[q].kind)==="voiceover");
      var idx=arr.length>1?(q/arr.length):0;
      var frac=vo?Math.min(0.12+idx,0.8):Math.min(0.3+idx,0.88);
      var t=st+len*frac;
      if(t>nt-0.35)t=Math.max(st,nt-0.35);
      arr[q].at=fmtT(t);
    }
  }
  renderLines();flash("已按镜头归属排时间点");
}

function lineWarn(t,segIdx){

function shotTimesOf(n,dur){
  var out=[],i;
  if(n<=0)return out;
  if(n===1){out.push(0);return out;}
  var head=Math.min(1.0,dur*0.2),tail=Math.min(1.0,dur*0.2);
  var usable=Math.max(0,dur-head-tail);
  var step=usable/(n-1);
  for(i=0;i<n;i++)out.push(i===0?0:Math.min(head+step*i,Math.max(0,dur-0.3)));
  return out;
}

  if(mode==="fixed"){

    p[0].at="";

function shotPlanCard(){
  var p=S.shotPlan||[];if(!p.length)return "";
  var dur=segDur(),out="";
  for(var i=0;i<p.length;i++){
    var r=p[i],bits=[];
    if(i===0)bits.push("时间点 0.000 秒（段首，不写时间戳）");
    else bits.push("时间点 "+(r.at||"")+" 秒");
    if(r.cam)bits.push("运镜："+labelOf(SHOT_CAM,r.cam));
    if(r.dist)bits.push("景别："+r.dist);
    if(r.who)bits.push("画面主角："+labelOf(SHOT_WHO,r.who));
    if(i>0&&r.trans)bits.push("从上一镜的转场："+labelOf(SHOT_TRANS,r.trans));
    if(r.note)bits.push("内容："+String(r.note).trim());
    out+="[Shot "+(i+1)+"] "+bits.join("；")+"\n";
  }
  return out;
}

function shotPlanWarn(t,segIdx){
  var p=S.shotPlan||[];if(!p.length)return "";

  while((x=re.exec(String(t||"")))){if(+x[1]>max)max=+x[1];}

  if(max<p.length)m.push("只写了 "+max+" 个镜头，镜头表要求 "+p.length+" 个");

  for(k=i-1;k>=0;k--){if(S.multiSegs[k]&&S.multiSegs[k].text){prev=S.multiSegs[k];break;}}
  if(!prev)return {anchor:"",lastShot:"",lastSound:""};
  return {anchor:prev.head||extractHead(prev.text),lastShot:prev.lastShot||lastShotOf(prev.text),
          lastSound:soundOf(prev.text)};
}
function genNextSeg(){
  var base=apiBase();
  if(!base){alert("先在上方填写 llama-server 地址，例如 http://127.0.0.1:8080/v1");return;}
  if(MULTI.run){alert("正在生成中，请等待或点「中断」");return;}
  var brief=($("multiBrief").value||"").trim();
  if(!brief){alert("先写整体需求，比如「女孩在落地窗前跳现代舞」");return;}
  var dur=segDur(),i=segCount();
  var a=segAnchor(i);
  MULTI={run:true,stop:false,brief:brief,p:null,anchor:a.anchor,lastShot:a.lastShot,lastSound:a.lastSound};
  S.multiBrief=brief;
  S.multiSegs.push({dur:dur,text:"",head:"",end:"",lastShot:"",st:"wait"});
  renderMultiList();calcSplit();renderLines();
  $("multiBtn").disabled=true;$("multiStop").disabled=false;
  $("multiInfo").textContent="生成第 "+(i+1)+" 段（"+dur+" 秒）…约 40-90 秒";
  runSeg(i,dur,brief,base);
}
function segReq(i,dur,brief,base){
  return reqJSON(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:DEF_MODEL,messages:[{role:"system",content:buildMultiSys(i,dur)},{role:"user",content:buildMultiUser(brief,i,dur)}],temperature:0.7,max_tokens:8192,reasoning_budget:0})});
}
function runSeg(i,dur,brief,base,only){
  if(MULTI.stop){multiDone("已中断");updateMultiStat("已中断");return;}
  S.multiSegs[i].st="run";S.multiSegs[i].warn="";renderMultiList();
  $("multiInfo").textContent="生成第 "+(i+1)+" 段（"+dur+" 秒）…约 40-90 秒";
  segReq(i,dur,brief,base)
  .then(function(j){
    var ps=parseMultiSeg(aiText(j)),g=S.multiSegs[i];
    ps.text=normSeg(ps.text,g.dur);
    g.text=ps.text;g.head=extractHead(ps.text);g.lastShot=lastShotOf(ps.text);g.end=ps.end;g.st="done";
    var w="";
    if(!ps.has)w="没识别出 detailed_description 字段，输出可能不完整，建议点「重试」";
    else if(ps.miss.length)w="缺少字段："+ps.miss.join("、")+"　建议点「重试」或手动补上";
    else if(ps.text.length<200)w="正文过短，多半被思考挤掉了，建议点「重试」";
    else if(shotStart(ps.text)!==1)w="镜头没有从 [Shot 1] 起编号，可手动改一下";
    else if(wearMiss(ps.text))w=wearMiss(ps.text);
    else if(shotPlanWarn(ps.text,i))w=shotPlanWarn(ps.text,i);
    else if(lineWarn(ps.text,i))w=lineWarn(ps.text,i);
    if(!w&&(j.usage&&j.usage.completion_tokens>=8150))w="输出接近 token 上限，可能不完整，建议点「重试」或缩短需求";
    g.warn=w;
    renderMultiList();calcSplit();renderLines();
    var n=segCount(),msg;
    if(only)msg="第 "+(i+1)+" 段已重新生成";
    else msg="第 "+(i+1)+" 段完成，确认无误后点「生成下一段」";
    multiDone(msg);
    updateMultiStat(msg);
  })
  .catch(function(e){
    var g=S.multiSegs[i];g.st="err";g.text="生成失败："+e.message;
    renderMultiList();
    multiDone("第 "+(i+1)+" 段失败："+e.message);
    updateMultiStat("第 "+(i+1)+" 段失败");
  });
}
function retrySeg(i){
  if(MULTI.run){alert("正在生成中，请先等待或点「中断」");return;}
  var base=apiBase();
  if(!base){alert("先在上方填写 llama-server 地址");return;}
  var brief=($("multiBrief").value||"").trim();
  if(!brief){alert("需求为空，填一下整体需求");return;}
  var g=S.multiSegs[i];if(!g)return;
  var a=segAnchor(i);
  MULTI={run:true,stop:false,brief:brief,p:null,anchor:a.anchor,lastShot:a.lastShot,lastSound:a.lastSound};
  $("multiBtn").disabled=true;$("multiStop").disabled=false;
  runSeg(i,g.dur||segDur(),brief,base,true);
}

init();
</script>
